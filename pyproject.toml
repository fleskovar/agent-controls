[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-controls"
version = "0.1.0"
description = "Python SDK and CLI for agent lifecycle hooks, with tracked session state."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fleskovar" }]
requires-python = ">=3.11"
dependencies = ["GitPython>=3.1"]

[project.urls]
Homepage = "https://github.com/fleskovar/agent-controls"
Issues = "https://github.com/fleskovar/agent-controls/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-testmon>=2.1", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pyright>=1.1.380", "PyYAML>=6"]

[project.scripts]
agent_controls = "agent_controls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_controls = ["hcm_bundle/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/protected", "tests/protected/cases"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "ARG", "C4", "PTH", "RUF", "ANN"]
# A process implements `run(event)` even when it does not read the event.
ignore = ["ARG002", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "E501", "ANN"]
"src/agent_controls/__init__.py" = ["N816"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
